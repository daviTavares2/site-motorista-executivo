<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Motorista Executivo</title>
    <script>
      // Safari (and other mobile browsers) can restore this page from its
      // back-forward cache — a frozen in-memory snapshot from a previous
      // visit — instead of actually loading it again over the network.
      // That snapshot can be arbitrarily old, so force a real reload
      // whenever that happens to guarantee the latest deployed version.
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
          window.location.reload()
        }
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
